services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vanteris
      POSTGRES_USER: vanteris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a dedicated database password}
    volumes:
      - vanteris-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanteris -d vanteris"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set database URL using the private db hostname}
    depends_on:
      db:
        condition: service_healthy
volumes:
  vanteris-db:
